inputTypes:
  - inputId: "AGE"
    label: "Idade"
    valueType: INTEGER
    unit: YEARS
    precision: 0
    plausibleRange:
      min: 10
      max: 120
    measurementProtocolNotes: "Derivada da data de nascimento quando disponível; nunca armazenada como dado independente da avaliação."
  - inputId: "BODY_MASS"
    label: "Massa corporal"
    valueType: DECIMAL
    unit: KG
    precision: 1
    plausibleRange:
      min: 20.0
      max: 300.0
    measurementProtocolNotes: null
  - inputId: "HEIGHT"
    label: "Estatura"
    valueType: DECIMAL
    unit: CM
    precision: 1
    plausibleRange:
      min: 100.0
      max: 250.0
    measurementProtocolNotes: null
  - inputId: "SKINFOLD_SUBSCAPULAR"
    label: "Dobra cutânea subescapular"
    valueType: DECIMAL
    unit: MM
    precision: 1
    plausibleRange:
      min: 2.0
      max: 80.0
    measurementProtocolNotes: "Medida em milímetros, lado direito, conforme protocolo de dobras da plataforma."
  - inputId: "SKINFOLD_TRICEPS"
    label: "Dobra cutânea tricipital"
